<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}</style></head><body><title>Programme Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: engineering workbench. Toolbar on top, task sheet + Gantt split in the middle, inspector rail on the right, status strip below. */
:root {
  --bg: #eef0f3; --surface: #ffffff; --surface-2: #f5f6f8; --line: #d6dae1; --line-strong: #a9b0bc;
  --fg: #1b2230; --muted: #5d6676; --accent: #2b55c9; --accent-weak: #e4ebfb; --sel: #dfe7fb;
  --bar: #5266e0; --bar-edge: #2a3db0; --sum: #2b303a; --crit: #d0383a; --crit-edge: #9c1f22;
  --ok: #24804f; --warn: #a86a0f; --err: #c22f32; --dl: #2e9a46; --link: #3346c9; --weekend: #f1f2f5;
  --f-ui: "IBM Plex Sans", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --rh: 26px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12151b; --surface: #1a1e26; --surface-2: #20252f; --line: #2e3440; --line-strong: #485062;
  --fg: #e3e7ee; --muted: #98a1b2; --accent: #7e9dff; --accent-weak: #22305a; --sel: #26324f;
  --bar: #6b7ff0; --bar-edge: #9aa8ff; --sum: #d7dbe3; --crit: #ff6b6b; --crit-edge: #ffa0a0;
  --ok: #4cc584; --warn: #e3a845; --err: #ff6b6b; --dl: #4cc56a; --link: #8fa2ff; --weekend: #171b22; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12151b; --surface: #1a1e26; --surface-2: #20252f; --line: #2e3440; --line-strong: #485062;
  --fg: #e3e7ee; --muted: #98a1b2; --accent: #7e9dff; --accent-weak: #22305a; --sel: #26324f;
  --bar: #6b7ff0; --bar-edge: #9aa8ff; --sum: #d7dbe3; --crit: #ff6b6b; --crit-edge: #ffa0a0;
  --ok: #4cc584; --warn: #e3a845; --err: #ff6b6b; --dl: #4cc56a; --link: #8fa2ff; --weekend: #171b22; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-ui); font-size: 13px; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
.app { height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; }
.top { display: flex; align-items: center; gap: 12px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; letter-spacing: .02em; white-space: nowrap; }
.mark { width: 18px; height: 18px; display: grid; grid-template-rows: repeat(3, 1fr); gap: 2px; }
.mark i { display: block; height: 4px; background: var(--accent); border-radius: 1px; }
.mark i:nth-child(1) { width: 60%; } .mark i:nth-child(2) { width: 85%; margin-left: 25%; } .mark i:nth-child(3) { width: 45%; margin-left: 55%; background: var(--crit); }
#projName { min-width: 0; flex: 1 1 220px; max-width: 420px; border: 1px solid transparent; background: transparent; padding: 4px 8px; border-radius: 6px; font-weight: 500; }
#projName:hover, #projName:focus { border-color: var(--line); background: var(--surface-2); outline: none; }
.spacer { flex: 1; }
.tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--surface-2); border-bottom: 1px solid var(--line); }
.grp { display: flex; gap: 2px; padding-right: 6px; margin-right: 2px; border-right: 1px solid var(--line); }
.grp:last-child { border-right: 0; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--line-strong); }
.btn:focus-visible, .ic:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.on { background: var(--accent-weak); border-color: var(--accent); }
.ic { height: 30px; min-width: 30px; padding: 0 7px; border: 1px solid transparent; background: transparent; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
.ic:hover { background: var(--surface); border-color: var(--line); }
.ic svg, .btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic .lbl { font-size: 12px; }
select.sm { height: 30px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 0 6px; }

.work { display: flex; min-height: 0; min-width: 0; }
.pane { overflow: auto; min-width: 0; position: relative; background: var(--surface); }
#gridPane { flex: none; width: 600px; max-width: 70%; }
#chartPane { flex: 1 1 auto; }
.split { flex: none; width: 6px; cursor: col-resize; background: var(--line); border-left: 1px solid var(--line-strong); }
.split:hover { background: var(--accent); }

.ghead { position: sticky; top: 0; z-index: 3; background: var(--surface-2); border-bottom: 2px solid var(--line-strong); height: 46px; }
.grid { width: max-content; min-width: 100%; }
.r { display: grid; grid-template-columns: var(--cols); height: var(--rh); border-bottom: 1px solid var(--line); }
.ghead .r { height: 44px; border: 0; }
.ghead .c { font-weight: 600; font-size: 12px; color: var(--muted); align-items: flex-end; padding-bottom: 6px; }
.c { display: flex; align-items: center; padding: 0 6px; border-right: 1px solid var(--line); overflow: hidden; white-space: nowrap; min-width: 0; }
.c.num { justify-content: flex-end; font-family: var(--f-num); font-size: 12px; font-variant-numeric: tabular-nums; }
.c.idc { justify-content: center; color: var(--muted); font-family: var(--f-num); font-size: 12px; background: var(--surface-2); position: sticky; left: 0; z-index: 1; }
.c.name { gap: 4px; }
.c.name .tx { overflow: hidden; text-overflow: ellipsis; }
.r.sum .c.name, .r.sum .c.num { font-weight: 600; }
.r.selrow { background: var(--sel); }
.r.selrow .c.idc { background: var(--accent); color: #fff; }
.c.act { outline: 2px solid var(--accent); outline-offset: -2px; }
.c input.ed { width: 100%; height: 22px; border: 0; outline: 0; background: var(--surface); padding: 0 2px; font: inherit; }
.tog { width: 14px; height: 14px; display: inline-grid; place-items: center; cursor: pointer; color: var(--muted); flex: none; border: 0; background: none; padding: 0; }
.tog svg { width: 10px; height: 10px; fill: currentColor; stroke: none; }
.ind { display: flex; gap: 2px; justify-content: center; }
.ind span { width: 12px; height: 12px; border-radius: 2px; display: inline-grid; place-items: center; font-size: 9px; font-weight: 700; line-height: 1; }
.ind .k-cons { border: 1px solid var(--accent); background: var(--accent-weak); }
.ind .k-late { background: var(--err); color: #fff; border-radius: 50%; }
.ind .k-note { border: 1px solid var(--line-strong); }
.r.addrow .c.name { color: var(--muted); font-style: italic; }
.c.tf.crit { color: var(--crit); font-weight: 600; }
.c.late { color: var(--err); font-weight: 600; }

.chart { position: relative; width: max-content; min-width: 100%; }
.scale { position: sticky; top: 0; z-index: 3; height: 46px; background: var(--surface-2); border-bottom: 2px solid var(--line-strong); }
.scale svg, #gantt { display: block; }
#gantt { user-select: none; }
#gantt .bar { cursor: grab; }
#gantt .bar.dragging { cursor: grabbing; opacity: .7; }

.panel { flex: none; width: 340px; border-left: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
.panel[hidden] { display: none !important; }
.tabs { display: flex; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.tab { flex: 1; height: 38px; border: 0; background: none; cursor: pointer; border-bottom: 2px solid transparent; font-weight: 500; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.tab.on { color: var(--fg); border-bottom-color: var(--accent); }
.badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; font-size: 11px; display: inline-grid; place-items: center; background: var(--err); color: #fff; font-family: var(--f-num); }
.badge.warn { background: var(--warn); }
.badge[hidden] { display: none; }
.pbody { overflow: auto; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 14px; min-height: 0; flex: 1; }
.fld { display: flex; flex-direction: column; gap: 4px; }
.fld > label, .lab { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.fld input[type=text], .fld input[type=date], .fld input[type=number], .fld select, .fld textarea { width: 100%; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 6px 8px; }
.fld textarea { min-height: 64px; resize: vertical; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row2 > * { min-width: 0; }
.chk { display: flex; align-items: center; gap: 6px; }
.chks { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.why { border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 6px; padding: 10px 12px; background: var(--surface-2); display: flex; flex-direction: column; gap: 6px; line-height: 1.45; }
.why.crit { border-left-color: var(--crit); }
.why b { font-weight: 600; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 12px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-family: var(--f-num); }
table.lk { width: 100%; border-collapse: collapse; font-size: 12px; }
table.lk th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11px; padding: 4px; border-bottom: 1px solid var(--line); }
table.lk td { padding: 3px 4px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.lk input, table.lk select { width: 100%; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); padding: 2px 4px; }
table.lk .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 120px; }
.lnk { color: var(--accent); cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
.lnk:hover { text-decoration: underline; }
.empty { color: var(--muted); line-height: 1.5; }
.iss { display: flex; flex-direction: column; gap: 6px; }
.it { display: grid; grid-template-columns: 10px 1fr; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; background: var(--surface); text-align: left; line-height: 1.4; }
.it:hover { border-color: var(--line-strong); }
.it .sv { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; }
.it.err .sv { background: var(--err); } .it.warn .sv { background: var(--warn); } .it.info .sv { background: var(--accent); }
.it small { color: var(--muted); display: block; margin-top: 2px; }
.sect { display: flex; flex-direction: column; gap: 10px; padding-top: 4px; }
.sect + .sect { border-top: 1px solid var(--line); padding-top: 14px; }
.sect h3 { margin: 0; font-size: 13px; font-weight: 600; }
.status { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; padding-block: 5px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--surface-2); border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.status b { color: var(--fg); font-weight: 500; font-family: var(--f-num); }
.status .pill { padding: 1px 8px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }
.status .pill.bad { color: var(--err); border-color: var(--err); }
.status .pill.good { color: var(--ok); border-color: var(--ok); }

.modal { position: fixed; inset: 0; z-index: 50; background: rgba(10, 14, 22, .55); display: flex; flex-direction: column; padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.mhead { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--surface); border-radius: 8px 8px 0 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.mhead h2 { margin: 0; font-size: 14px; font-weight: 600; }
.mbody { flex: 1; overflow: auto; background: var(--bg); border-radius: 0 0 8px 8px; padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
.mbody canvas { background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.25); max-width: 100%; height: auto; }
.pgl { font-size: 12px; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: calc(44px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--fg); color: var(--surface); padding: 9px 14px; border-radius: 8px; font-size: 13px; max-width: min(560px, calc(100vw - 32px)); box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.drop { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; background: rgba(43, 85, 201, .18); border: 3px dashed var(--accent); font-size: 18px; font-weight: 600; color: var(--accent); pointer-events: none; }
@media (max-width: 900px) {
  .panel { position: fixed; right: 0; top: 0; bottom: 0; z-index: 40; width: min(340px, 92vw); box-shadow: -8px 0 24px rgba(0,0,0,.2); padding-top: env(safe-area-inset-top, 0px); padding-right: env(safe-area-inset-right, 0px); }
  #gridPane { width: 55%; }
  .ic .lbl { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>Programme Studio</div>
    <input id="projName" type="text" aria-label="項目名稱" spellcheck="false">
    <span class="spacer"></span>
    <button class="btn" id="bOpen" title="開啟 MS Project XML 或 Programme Studio JSON"><svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3z"/></svg>開啟</button>
    <button class="btn" id="bSave" title="下載項目檔（.json）"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>儲存</button>
    <button class="btn" id="bXml" title="匯出給 MS Project 開啟的 XML"><svg viewBox="0 0 24 24"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13 6l-2 12"/></svg>MS Project XML</button>
    <button class="btn" id="bPrev" title="預覽 PDF 版面"><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>預覽</button>
    <button class="btn primary" id="bPdf"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M12 10v7M9 14l3 3 3-3"/></svg>匯出 PDF</button>
  </header>
  <nav class="tools" aria-label="編輯工具">
    <div class="grp">
      <button class="ic" id="bUndo" title="還原 (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-4"/></svg></button>
      <button class="ic" id="bRedo" title="重做 (Ctrl+Y)"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 000 10h4"/></svg></button>
    </div>
    <div class="grp">
      <button class="ic" id="bAdd" title="新增工作 (Insert)"><svg viewBox="0 0 24 24"><rect x="3" y="9" width="12" height="6" rx="1"/><path d="M19 8v8M15 12h8"/></svg><span class="lbl">工作</span></button>
      <button class="ic" id="bMs" title="新增里程碑"><svg viewBox="0 0 24 24"><path d="M12 4l7 8-7 8-7-8z"/></svg><span class="lbl">里程碑</span></button>
      <button class="ic" id="bDel" title="刪除 (Delete)"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg><span class="lbl">刪除</span></button>
    </div>
    <div class="grp">
      <button class="ic" id="bOut" title="凸排 (Alt+Shift+←)"><svg viewBox="0 0 24 24"><path d="M11 6H21M11 12h10M11 18h10M7 9l-3 3 3 3"/></svg></button>
      <button class="ic" id="bIn" title="縮排 (Alt+Shift+→)"><svg viewBox="0 0 24 24"><path d="M11 6H21M11 12h10M11 18h10M4 9l3 3-3 3"/></svg></button>
      <button class="ic" id="bUp" title="上移 (Alt+Shift+↑)"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
      <button class="ic" id="bDown" title="下移 (Alt+Shift+↓)"><svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
    </div>
    <div class="grp">
      <button class="ic" id="bLink" title="連結所選工作，依點選順序 FS (Ctrl+F2)"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/></svg><span class="lbl">連結</span></button>
      <button class="ic" id="bUnlink" title="取消連結 (Ctrl+Shift+F2)"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/><path d="M4 4l16 16"/></svg><span class="lbl">取消連結</span></button>
    </div>
    <div class="grp">
      <select class="sm" id="zoom" aria-label="時間刻度">
        <option value="fit">整個項目</option><option value="week">週</option><option value="month">月</option><option value="quarter">季</option>
      </select>
      <button class="ic" id="bCrit" title="標示關鍵路徑"><svg viewBox="0 0 24 24"><path d="M3 17h5l3-10 3 10h7"/></svg><span class="lbl">關鍵路徑</span></button>
      <button class="ic" id="bGoto" title="捲動到所選工作"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
    </div>
    <span class="spacer"></span>
    <button class="ic" id="bPanel" title="顯示 / 隱藏側欄"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg><span class="lbl">側欄</span></button>
  </nav>
  <div class="work" id="work">
    <section class="pane" id="gridPane" aria-label="工作表">
      <div class="grid" id="grid"></div>
    </section>
    <div class="split" id="split" role="separator" aria-orientation="vertical" tabindex="0" title="拖動調整寬度"></div>
    <section class="pane" id="chartPane" aria-label="甘特圖">
      <div class="chart" id="chart"><div class="scale" id="scale"></div><svg id="gantt"></svg></div>
    </section>
    <aside class="panel" id="panel">
      <div class="tabs" role="tablist">
        <button class="tab on" data-tab="task" role="tab">工作</button>
        <button class="tab" data-tab="issues" role="tab">檢查 <span class="badge" id="issBadge" hidden>0</span></button>
        <button class="tab" data-tab="pdf" role="tab">PDF</button>
        <button class="tab" data-tab="proj" role="tab">項目</button>
      </div>
      <div class="pbody" id="pbody"></div>
    </aside>
  </div>
  <footer class="status" id="status"></footer>
</div>
<div class="modal" id="modal" hidden>
  <div class="mhead"><h2>PDF 預覽</h2><span class="pgl" id="mInfo"></span><span class="spacer"></span>
    <button class="btn" id="mClose">關閉</button><button class="btn primary" id="mPdf">匯出 PDF</button></div>
  <div class="mbody" id="mBody"></div>
</div>
<input type="file" id="fileIn" accept=".xml,.json,.mpp" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

      }
      if (c.k === 'name') {
        const indent = (t.lvl - 1) * 16;
        const tg = r.sum ? `<button class="tog" data-tog="${t.uid}" aria-label="展開或收合">${UI.collapsed.has(t.uid) ? SVG_RIGHT : SVG_DOWN}</button>` : '<span style="width:14px;flex:none"></span>';
        return `<div class="c name${act}" data-k="name" style="padding-left:${6 + indent}px">${tg}<span class="tx">${esc(t.name)}</span></div>`;
      }
      const extra = (c.k === 'tf' && r.crit ? ' crit' : '') + (c.k === 'finish' && late ? ' late' : '');
      return `<div class="c num ${c.k}${act}${extra}" data-k="${c.k}">${esc(cellText(r, c.k))}</div>`;
    }).join('');
    return `<div class="${cls}" data-vi="${vi}" data-uid="${t.uid}">${cells}</div>`;
  }).join('');
  const add = `<div class="r addrow" data-add="1">${COLS.map(c => `<div class="c${c.k === 'id' ? ' idc' : ''}${c.k === 'name' ? ' name' : ''}">${c.k === 'name' ? '<span style="width:14px"></span>按這裏或按 Insert 新增工作' : ''}</div>`).join('')}</div>`;
  g.innerHTML = head + rows + add + '<div style="height:40px"></div>';
}

// ============================================================ timescale
function unitStart(unit, d) {
  const [y, m] = ymd(d);
  if (unit === 'year') return dn(`${y}-01-01`);
  if (unit === 'quarter') return dn(`${y}-${pad(Math.floor((m - 1) / 3) * 3 + 1)}-01`);
  if (unit === 'month') return dn(`${y}-${pad(m)}-01`);
  return d - ((dowOf(d) + 6) % 7);     // week (Mon)
}
function unitNext(unit, d) {
  const [y, m] = ymd(d);
  if (unit === 'year') return dn(`${y + 1}-01-01`);
  if (unit === 'quarter') { const nm = m + 3; return nm > 12 ? dn(`${y + 1}-${pad(nm - 12)}-01`) : dn(`${y}-${pad(nm)}-01`); }
  if (unit === 'month') return m === 12 ? dn(`${y + 1}-01-01`) : dn(`${y}-${pad(m + 1)}-01`);
  return d + 7;
}
function unitLabels(unit, a, top) {
  const [y, m, d] = ymd(a);
  if (unit === 'year') return [String(y), `'${pad(y % 100)}`];
  if (unit === 'quarter') { const q = Math.floor((m - 1) / 3) + 1; return top ? [`${['1st', '2nd', '3rd', '4th'][q - 1]} Quarter ${y}`, `${['1st', '2nd', '3rd', '4th'][q - 1]} Quarter`, `Q${q} ${y}`, `Q${q}`] : [`Q${q}`, `${q}`]; }
  if (unit === 'month') return top ? [`${['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][m - 1]} ${y}`, `${MON[m - 1]} ${y}`, `${MON[m - 1]} '${pad(y % 100)}`, MON[m - 1]] : [MON[m - 1], MON[m - 1][0]];
  return [String(d), ''];
}
function segments(unit, r0, r1) {
  const out = []; let a = unitStart(unit, r0);
  while (a < r1) { const b = unitNext(unit, a); out.push({ a: Math.max(a, r0), b: Math.min(b, r1), a0: a }); a = b; }
  return out;
}
const TIERS = { week: ['month', 'week'], month: ['quarter', 'month'], quarter: ['year', 'quarter'] };
function autoTier(r0, r1) { const months = (r1 - r0) / 30.4; return months <= 5 ? 'week' : months <= 40 ? 'month' : 'quarter'; }
function chartRange() {
  let lo = S.start, hi = S.finish;
  for (const r of S.R) if (r.t.deadline) hi = Math.max(hi, dn(r.t.deadline));
  return [unitStart('month', lo - 10), unitNext('month', hi + 10)];
}

// ============================================================ Gantt (screen)
let GX = { r0: 0, r1: 0, ppd: 4 };
const RH = 26;
function renderGantt() {
  const [r0, r1] = chartRange();
  const paneW = $('#chartPane').clientWidth - 2;
  let mode = UI.zoom, ppd;
  if (mode === 'fit') { ppd = Math.max(0.4, paneW / (r1 - r0)); mode = autoTier(r0, r1); }
  else ppd = { week: 22, month: 5, quarter: 1.6 }[mode];
  GX = { r0, r1, ppd, mode };
  const W = Math.ceil((r1 - r0) * ppd), H = VIS.length * RH + 40;
  const X = d => (d - r0) * ppd;
  const cs = getComputedStyle(document.documentElement), col = k => cs.getPropertyValue(k).trim();
  // scale
  const [tu, bu] = TIERS[mode];
  const ctx = document.createElement('canvas').getContext('2d'); ctx.font = '12px "IBM Plex Sans", sans-serif';
  const fit = (labels, w) => labels.find(l => ctx.measureText(l).width + 8 <= w) ?? '';
  let sc = `<svg width="${W}" height="46" font-family="IBM Plex Sans, sans-serif" font-size="12">`;
  for (const s of segments(tu, r0, r1)) { const x = X(s.a), w = X(s.b) - x; sc += `<line x1="${X(s.b)}" y1="0" x2="${X(s.b)}" y2="23" stroke="${col('--line-strong')}"/><text x="${x + 5}" y="16" fill="${col('--fg')}">${esc(fit(unitLabels(tu, s.a0, true), w))}</text>`; }
  sc += `<line x1="0" y1="23" x2="${W}" y2="23" stroke="${col('--line')}"/>`;
  for (const s of segments(bu, r0, r1)) { const x = X(s.a), w = X(s.b) - x; const lab = fit(unitLabels(bu, s.a0, false), w); sc += `<line x1="${X(s.b)}" y1="23" x2="${X(s.b)}" y2="46" stroke="${col('--line')}"/><text x="${x + w / 2}" y="39" text-anchor="middle" fill="${col('--muted')}">${esc(lab)}</text>`; }
  $('#scale').innerHTML = sc + '</svg>';
  // body
  let g = '';
  if (ppd >= 8) for (let d = r0; d < r1; d++) if (!CAL.isWork(d)) g += `<rect x="${X(d)}" y="0" width="${ppd}" height="${H}" fill="${col('--weekend')}"/>`;
  const selSet = new Set(UI.sel);
  VIS.forEach((r, vi) => { if (selSet.has(r.t.uid)) g += `<rect x="0" y="${vi * RH}" width="${W}" height="${RH}" fill="${col('--sel')}"/>`; });
  for (const s of segments(bu, r0, r1)) g += `<line x1="${X(s.a)}" y1="0" x2="${X(s.a)}" y2="${H}" stroke="${col('--line')}" stroke-width=".6"/>`;
  for (const s of segments(tu, r0, r1)) g += `<line x1="${X(s.a)}" y1="0" x2="${X(s.a)}" y2="${H}" stroke="${col('--line-strong')}" stroke-dasharray="2 3"/>`;
  const td = todayDn(); if (td > r0 && td < r1) g += `<line x1="${X(td)}" y1="0" x2="${X(td)}" y2="${H}" stroke="${col('--accent')}" stroke-width="1" opacity=".5"/>`;
  const pos = new Map();
  const crit = UI.crit;
  VIS.forEach((r, vi) => {
    const y = vi * RH, ym = y + RH / 2, t = r.t;
    if (r.sum) {
      const x1 = X(r.start), x2 = X(r.finish + 1);
      g += `<g fill="${col('--sum')}"><rect x="${x1}" y="${ym - 3}" width="${Math.max(2, x2 - x1)}" height="5"/><path d="M${x1 - 4} ${ym - 3}h8l-4 7z M${x2 - 4} ${ym - 3}h8l-4 7z"/></g>`;
      pos.set(t.uid, { y: ym, x1, x2 });
    } else if (t.dur === 0) {
      const x = X(r.finish + (r.eod ? 1 : 0));
      g += `<g class="bar" data-uid="${t.uid}"><path d="M${x} ${ym - 7}l7 7-7 7-7-7z" fill="${crit && r.crit ? col('--crit') : col('--sum')}"/><text x="${x + 10}" y="${ym + 4}" font-size="11" font-weight="600" fill="${col('--fg')}" font-family="IBM Plex Mono, monospace">${esc(fmtShort(r.finish))}</text></g>`;
      pos.set(t.uid, { y: ym, x1: x, x2: x, ms: true });
    } else {
      const x1 = X(r.start), x2 = X(r.finish + 1), c = crit && r.crit;
      g += `<g class="bar" data-uid="${t.uid}"><rect x="${x1}" y="${ym - 6}" width="${Math.max(3, x2 - x1)}" height="12" rx="2.5" fill="${c ? col('--crit') : col('--bar')}" stroke="${c ? col('--crit-edge') : col('--bar-edge')}" stroke-width=".8"/><rect class="rz" x="${x2 - 5}" y="${ym - 6}" width="7" height="12" fill="transparent" style="cursor:ew-resize"/></g>`;
      pos.set(t.uid, { y: ym, x1, x2 });
    }
    if (t.deadline) { const x = X(dn(t.deadline) + 1); g += `<path d="M${x} ${ym - 9}v6M${x - 3.5} ${ym - 4}h7l-3.5 5z" stroke="${col('--dl')}" fill="${col('--dl')}" stroke-width="1.2"/>`; }
  });
  // links
  let lk = '';
  VIS.forEach(r => {
    for (const p of r.t.preds) {
      const a = pos.get(p.uid), b = pos.get(r.t.uid); if (!a || !b) continue;
      const pr = S.byUid.get(p.uid); if (pr && r.start - pr.finish > 30) continue;
      lk += linkPath(a, b, p.type || 'FS', RH);
    }
  });
  g += `<g fill="none" stroke="${col('--link')}" stroke-width="1">${lk}</g>`;
  const svg = $('#gantt'); svg.setAttribute('width', W); svg.setAttribute('height', H); svg.innerHTML = `<defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L8 4 0 8z" fill="${col('--link')}"/></marker></defs>` + g;
  $('#chart').style.width = W + 'px';
}
function linkPath(a, b, type, rh) {
  const sx = (type === 'SS' || type === 'SF') ? a.x1 : a.x2, tx = (type === 'FS' || type === 'SS') ? b.x1 : b.x2;
  const down = b.y > a.y, bh = b.ms ? 7 : 6;
  if ((type === 'FS' || type === 'SS') && tx >= sx + 4) {
    const ty = down ? b.y - bh : b.y + bh, x = Math.max(tx + 2, sx + 4);
    return `<path d="M${sx} ${a.y}H${x}V${ty}" marker-end="url(#ah)"/>`;
  }
  const mid = down ? b.y - rh / 2 : b.y + rh / 2, ex = (type === 'FS' || type === 'SS') ? tx - 8 : tx + 8;
  return `<path d="M${sx} ${a.y}h${type === 'SS' || type === 'SF' ? -8 : 8}V${mid}H${ex}V${b.y}H${tx + ((type === 'FS' || type === 'SS') ? -1 : 1)}" marker-end="url(#ah)"/>`;
}

function whyText(r) {
  const t = r.t;
  if (r.sum) return `摘要工作，日期由子工作決定：最早 ${fmtD(r.start)}，最遲 ${fmtD(r.finish)}。`;
  if (r.cyc) return '<b>這項工作在循環連結之中</b>，日期無法正確計算。';
  const d = r.drv;
  if (d.k === 'pred') {
    const f = d.l.from, lag = d.l.lag ? `${d.l.lag > 0 ? '+' : ''}${d.l.lag} 工作天` : '';
    const what = { FS: `在 <b>${f.id} ${esc(f.t.name)}</b> 完成（${fmtD(f.finish)}）之後開始`, SS: `與 <b>${f.id} ${esc(f.t.name)}</b> 同時開始（${fmtD(f.start)}）`, FF: `與 <b>${f.id} ${esc(f.t.name)}</b> 同時完成（${fmtD(f.finish)}）`, SF: `在 <b>${f.id} ${esc(f.t.name)}</b> 開始時完成` }[d.l.type];
    return `開始日由前置工作決定：${what}${lag ? `，再加 ${lag}` : ''}${d.l.orig.sum ? `（經由摘要 ${d.l.orig.id}）` : ''}。`;
  }
  if (d.k === 'cons') { const c = t.cons; return `開始日由約束決定：<b>${CONS[c.type]} ${fmtD(dn(c.date))}</b>。${d.conflict ? '<br><b>注意：</b>約束比前置邏輯早，存在衝突。' : r.logicEs < r.es ? `<br>沒有這個約束的話，最早可於 ${fmtD(CAL.at(r.logicEs))} 開始。` : ''}`; }
  return `沒有前置工作或約束，所以在項目開始日（${fmtD(dn(P.start))}）開始。`;
}

  const cell = rowEl.querySelector(`[data-k="${k}"]`);

// ============================================================ structural edits
function selectedIdx() { const set = new Set(UI.sel); return P.tasks.map((t, i) => set.has(t.uid) ? i : -1).filter(i => i >= 0); }
function blockEnd(i) { const l = P.tasks[i].lvl; let j = i + 1; while (j < P.tasks.length && P.tasks[j].lvl > l) j++; return j; }
function addTask(milestone) {
  const ids = selectedIdx(); const at = ids.length ? blockEnd(ids[ids.length - 1]) : P.tasks.length;
  const lvl = ids.length ? P.tasks[ids[ids.length - 1]].lvl : 1;
  const t = { uid: uidSeq++, name: milestone ? 'New Milestone' : 'New Task', lvl, dur: milestone ? 0 : 5, preds: [] };
  mutate(() => P.tasks.splice(at, 0, t));
  UI.sel = [t.uid]; UI.act = t.uid; UI.col = 'name'; render(); scrollToRow(t.uid); startEdit(t.uid, 'name');
}
function delTasks() {
  const ids = selectedIdx(); if (!ids.length) return toast('先選擇要刪除的工作');
  const kill = new Set(); for (const i of ids) for (let j = i; j < blockEnd(i); j++) kill.add(P.tasks[j].uid);
  const nextUid = (P.tasks[blockEnd(ids[ids.length - 1])] || P.tasks[ids[0] - 1] || {}).uid;
  mutate(() => { P.tasks = P.tasks.filter(t => !kill.has(t.uid)); for (const t of P.tasks) t.preds = t.preds.filter(p => !kill.has(p.uid)); }, `已刪除 ${kill.size} 項工作（Ctrl+Z 可還原）`);
  UI.sel = nextUid ? [nextUid] : []; UI.act = nextUid ?? null; render();
}
function indent(d) {

  mutate(() => { const done = new Set(); for (const i of ids) { const e = blockEnd(i); for (let j = i; j < e; j++) if (!done.has(j)) { P.tasks[j].lvl += d; done.add(j); } } });
}
function moveRows(d) {
  const ids = selectedIdx(); if (ids.length !== 1) return toast('一次移動一項工作（連同其子工作）');
  const i = ids[0], e = blockEnd(i), block = P.tasks.slice(i, e);

    if (d < 0) { if (i === 0) return; let p = i - 1; while (p > 0 && P.tasks[p].lvl > block[0].lvl) p--; P.tasks.splice(i, e - i); P.tasks.splice(p, 0, ...block); }
    else { if (e >= P.tasks.length) return; const ne = blockEnd(e); P.tasks.splice(i, e - i); P.tasks.splice(ne - block.length, 0, ...block); }
  });
}
function linkSel() {
  if (UI.sel.length < 2) return toast('用 Ctrl 點選兩項或以上工作，再按「連結」');
  mutate(() => { for (let k = 1; k < UI.sel.length; k++) { const t = P.tasks.find(x => x.uid === UI.sel[k]); if (!t.preds.some(p => p.uid === UI.sel[k - 1])) t.preds.push({ uid: UI.sel[k - 1], type: 'FS', lag: 0 }); } }, `已連結 ${UI.sel.length} 項工作（FS）`);
}

    else for (const t of P.tasks) if (set.has(t.uid)) t.preds = t.preds.filter(p => !set.has(p.uid));

// ============================================================ Gantt dragging
let drag = null;
function onBarDown(e) {

  const uid = +g.dataset.uid, r = S.byUid.get(uid); if (!r || r.sum) return;
  const resize = e.target.classList.contains('rz');

}

  if (drag.resize) { const rect = drag.g.querySelector('rect'); const w0 = (drag.r.finish + 1 - drag.r.start) * GX.ppd; rect.setAttribute('width', Math.max(3, w0 + dx)); }

  }

// ============================================================ import / export
function readMspdi(text) {
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if (doc.querySelector('parsererror')) throw new Error('XML 格式錯誤，無法讀取');
  const root = doc.documentElement; if (root.localName !== 'Project') throw new Error('這不是 MS Project XML 檔');
  const kid = (el, n) => { if (!el) return null; for (const c of el.children) if (c.localName === n) return c; return null; };
  const val = (el, n) => { const c = kid(el, n); return c ? c.textContent.trim() : ''; };
  const kids = (el, n) => el ? [...el.children].filter(c => c.localName === n) : [];
  const mpd = +val(root, 'MinutesPerDay') || 480;
  const p = { name: val(root, 'Title') || val(root, 'Name') || 'Imported', title: val(root, 'Subject') || '', start: (val(root, 'StartDate') || isoOf(todayDn())).slice(0, 10), tasks: [], holidays: [], workdays: [1, 2, 3, 4, 5] };
  p.name = p.name.replace(/\.xml$/i, '');
  const calUid = val(root, 'CalendarUID');
  const cal = kids(kid(root, 'Calendars'), 'Calendar').find(c => val(c, 'UID') === calUid) || kids(kid(root, 'Calendars'), 'Calendar')[0];
  if (cal) {
    const wd = new Set([1, 2, 3, 4, 5]);
    for (const w of kids(kid(cal, 'WeekDays'), 'WeekDay')) {
      const dt = +val(w, 'DayType'), work = val(w, 'DayWorking') === '1';
      if (dt >= 1 && dt <= 7) { if (work) wd.add(dt - 1); else wd.delete(dt - 1); }
      else if (dt === 0 && !work) { const tp = kid(w, 'TimePeriod'); if (tp) addHolRange(p, val(tp, 'FromDate'), val(tp, 'ToDate')); }
    }
    for (const x of kids(kid(cal, 'Exceptions'), 'Exception')) { if (val(x, 'DayWorking') === '1') continue; const tp = kid(x, 'TimePeriod'); if (tp) addHolRange(p, val(tp, 'FromDate'), val(tp, 'ToDate'), val(x, 'Name')); }
    p.workdays = [...wd].sort();
  }
  const CT = { 0: 'ASAP', 1: 'ASAP', 2: 'MSO', 3: 'MFO', 4: 'SNET', 5: 'SNLT', 6: 'FNET', 7: 'FNLT' }, LT = { 0: 'FF', 1: 'FS', 2: 'SF', 3: 'SS' };
  let elapsed = 0;
  for (const tk of kids(kid(root, 'Tasks'), 'Task')) {
    if (val(tk, 'UID') === '0' || val(tk, 'IsNull') === '1') continue;
    const dm = val(tk, 'Duration').match(/PT(\d+(?:\.\d+)?)H(\d+(?:\.\d+)?)M/); const hours = dm ? +dm[1] + +dm[2] / 60 : 0;
    const t = { uid: +val(tk, 'UID'), name: val(tk, 'Name'), lvl: +val(tk, 'OutlineLevel') || 1, dur: Math.round(hours * 60 / mpd), preds: [] };
    if (val(tk, 'Milestone') === '1' && !hours) t.dur = 0;
    const ct = CT[+val(tk, 'ConstraintType') || 0]; const cd = val(tk, 'ConstraintDate');
    if (ct !== 'ASAP' && cd) t.cons = { type: ct, date: cd.slice(0, 10) };
    const dl = val(tk, 'Deadline'); if (dl) t.deadline = dl.slice(0, 10);
    const nt = val(tk, 'Notes'); if (nt) t.notes = nt;
    for (const pl of kids(tk, 'PredecessorLink')) {
      const lagMin = (+val(pl, 'LinkLag') || 0) / 10, fmt = +val(pl, 'LagFormat') || 7;
      if ([4, 6, 8, 10, 12].includes(fmt) && lagMin) elapsed++;
      t.preds.push({ uid: +val(pl, 'PredecessorUID'), type: LT[+val(pl, 'Type')] || 'FS', lag: Math.round(lagMin / mpd) });
    }
    p.tasks.push(t);
  }
  if (elapsed) setTimeout(() => toast(`${elapsed} 條連結用了日曆天 lag，已換算為工作天`), 400);
  return p;
}
function addHolRange(p, a, b, name) { if (!a) return; let d = dn(a.slice(0, 10)); const e = dn((b || a).slice(0, 10)); for (; d <= e && p.holidays.length < 2000; d++) p.holidays.push({ date: isoOf(d), name: name || '' }); }
function toMspdi() {
  const x = s => esc(s);
  const dt = (d, h) => `${isoOf(d)}T${pad(h)}:00:00`;
  const dur = d => `PT${d * 8}H0M0S`;
  const CTN = { ASAP: 0, MSO: 2, MFO: 3, SNET: 4, SNLT: 5, FNET: 6, FNLT: 7 }, LTN = { FF: 0, FS: 1, SF: 2, SS: 3 };
  const wdays = [0, 1, 2, 3, 4, 5, 6].map(d => `<WeekDay><DayType>${d + 1}</DayType><DayWorking>${P.workdays.includes(d) ? 1 : 0}</DayWorking>${P.workdays.includes(d) ? '<WorkingTimes><WorkingTime><FromTime>08:00:00</FromTime><ToTime>12:00:00</ToTime></WorkingTime><WorkingTime><FromTime>13:00:00</FromTime><ToTime>17:00:00</ToTime></WorkingTime></WorkingTimes>' : ''}</WeekDay>`).join('');
  const hols = P.holidays.map(h => `<WeekDay><DayType>0</DayType><DayWorking>0</DayWorking><TimePeriod><FromDate>${h.date}T00:00:00</FromDate><ToDate>${h.date}T23:59:00</ToDate></TimePeriod></WeekDay>`).join('');
  const outline = []; const num = [];
  const tasks = S.R.map(r => {
    const t = r.t; num.length = t.lvl; num[t.lvl - 1] = (num[t.lvl - 1] || 0) + 1; for (let k = t.lvl; k < 10; k++) num[k] = 0;
    const on = num.slice(0, t.lvl).join('.');
    const msEod = !r.sum && t.dur === 0 && r.eod;
    const st = r.sum || t.dur > 0 ? dt(r.start, 8) : dt(r.finish, msEod ? 17 : 8);
    const fi = r.sum || t.dur > 0 ? dt(r.finish, 17) : st;
    const c = t.cons && t.cons.type !== 'ASAP' && t.cons.date ? t.cons : null;
    const cHour = c && (c.type === 'FNET' || c.type === 'MFO' || c.type === 'FNLT') ? 17 : 8;
    return `<Task><UID>${t.uid}</UID><ID>${r.id}</ID><Name>${x(t.name)}</Name><Active>1</Active><Manual>0</Manual><Type>${r.sum ? 1 : 0}</Type><IsNull>0</IsNull><WBS>${on}</WBS><OutlineNumber>${on}</OutlineNumber><OutlineLevel>${t.lvl}</OutlineLevel><Priority>500</Priority><Start>${st}</Start><Finish>${fi}</Finish><Duration>${dur(r.sum ? r.dur : t.dur)}</Duration><DurationFormat>7</DurationFormat><ResumeValid>0</ResumeValid><EffortDriven>0</EffortDriven><Recurring>0</Recurring><OverAllocated>0</OverAllocated><Estimated>0</Estimated><Milestone>${!r.sum && t.dur === 0 ? 1 : 0}</Milestone><Summary>${r.sum ? 1 : 0}</Summary><Critical>${r.crit ? 1 : 0}</Critical><IsSubproject>0</IsSubproject><ConstraintType>${c ? CTN[c.type] : 0}</ConstraintType>${c ? `<ConstraintDate>${c.date}T${pad(cHour)}:00:00</ConstraintDate>` : ''}${t.deadline ? `<Deadline>${t.deadline}T17:00:00</Deadline>` : ''}<CalendarUID>-1</CalendarUID><PercentComplete>0</PercentComplete>${t.notes ? `<Notes>${x(t.notes)}</Notes>` : ''}${t.preds.filter(p => S.byUid.has(p.uid)).map(p => `<PredecessorLink><PredecessorUID>${p.uid}</PredecessorUID><Type>${LTN[p.type] ?? 1}</Type><CrossProject>0</CrossProject><LinkLag>${(+p.lag || 0) * 4800}</LinkLag><LagFormat>7</LagFormat></PredecessorLink>`).join('')}</Task>`;
  }).join('\n');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Project xmlns="http://schemas.microsoft.com/project"><SaveVersion>14</SaveVersion><Name>${x(P.name)}.xml</Name><Title>${x(P.name)}</Title><Subject>${x(P.title)}</Subject><ScheduleFromStart>1</ScheduleFromStart><StartDate>${dt(dn(P.start), 8)}</StartDate><FinishDate>${dt(S.finish, 17)}</FinishDate><CalendarUID>1</CalendarUID><DefaultStartTime>08:00:00</DefaultStartTime><DefaultFinishTime>17:00:00</DefaultFinishTime><MinutesPerDay>480</MinutesPerDay><MinutesPerWeek>2400</MinutesPerWeek><DaysPerMonth>20</DaysPerMonth><DurationFormat>7</DurationFormat><WorkFormat>2</WorkFormat><NewTasksAreManual>0</NewTasksAreManual><HonorConstraints>1</HonorConstraints>
<Calendars><Calendar><UID>1</UID><Name>Standard</Name><IsBaseCalendar>1</IsBaseCalendar><BaseCalendarUID>-1</BaseCalendarUID><WeekDays>${wdays}${hols}</WeekDays></Calendar></Calendars>
<Tasks><Task><UID>0</UID><ID>0</ID><Name>${x(P.name)}</Name><Type>1</Type><IsNull>0</IsNull><OutlineNumber>0</OutlineNumber><OutlineLevel>0</OutlineLevel><Start>${dt(S.start, 8)}</Start><Finish>${dt(S.finish, 17)}</Finish><Summary>1</Summary><Manual>0</Manual></Task>
${tasks}
</Tasks></Project>`;
}
let dlCap;   // downloads capability promise
function getDownloads() {

}

  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); toast(`已下載 ${filename}`);
}
const safeName = s => (s || 'programme').replace(/[\\/:*?"<>|]+/g, '_').trim();

}

  sp.addEventListener('keydown', e => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { gp.style.width = Math.max(200, gp.offsetWidth + (e.key === 'ArrowLeft' ? -40 : 40)) + 'px'; renderGantt(); } });
  // toolbar
  const on = (id, fn) => $(id).addEventListener('click', fn);
  on('#bOpen', () => $('#fileIn').click()); $('#fileIn').addEventListener('change', e => { openFile(e.target.files[0]); e.target.value = ''; });
  on('#bSave', () => saveFile(`${safeName(P.name)}.json`, JSON.stringify(P, null, 1), 'application/json'));
  on('#bXml', exportXml); on('#bPdf', exportPdf); on('#bPrev', () => { $('#modal').hidden = false; showPreview(); });
  on('#mClose', () => $('#modal').hidden = true); on('#mPdf', exportPdf);
  on('#bUndo', undo); on('#bRedo', redo); on('#bAdd', () => addTask(false)); on('#bMs', () => addTask(true)); on('#bDel', delTasks);
  on('#bIn', () => indent(1)); on('#bOut', () => indent(-1)); on('#bUp', () => moveRows(-1)); on('#bDown', () => moveRows(1));
  on('#bLink', linkSel); on('#bUnlink', unlinkSel); on('#bCrit', () => { UI.crit = !UI.crit; render(); });
  on('#bGoto', () => { if (UI.act != null) scrollToRow(UI.act, true); }); on('#bPanel', () => togglePanel());
  $('#zoom').addEventListener('change', e => { UI.zoom = e.target.value; renderGantt(); });
  $('#projName').addEventListener('change', e => { const v = e.target.value.trim(); if (v && v !== P.name) mutate(() => P.name = v); });
  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { UI.tab = b.dataset.tab; renderPanel(); }));
  // panel delegation
  const pb = $('#pbody');
  pb.addEventListener('click', e => {
    const go = e.target.closest('[data-go]'); if (go) return goTo(+go.dataset.go);
    const rm = e.target.closest('[data-prm]'); if (rm) { const t = selRow().t, k = +rm.dataset.prm; return mutate(() => t.preds.splice(k, 1)); }
    const id = e.target.id;
    if (id === 'pAdd') { const r = selRow(); const prev = S.R[r.i - 1]; return mutate(() => r.t.preds.push({ uid: prev && prev.t.uid !== r.t.uid ? prev.t.uid : S.R[0].t.uid, type: 'FS', lag: 0 })); }
    if (id === 'oPrev') { $('#modal').hidden = false; showPreview(); } if (id === 'oPdf') exportPdf();
    if (id === 'jNew') loadProject({ name: 'New Project', start: isoOf(todayDn()), tasks: [{ uid: 1, name: 'Project Start', lvl: 1, dur: 0, preds: [] }] }, '已建立新項目（Ctrl+Z 可還原）');
    if (id === 'jSample' && SAMPLE) loadProject(JSON.parse(JSON.stringify(SAMPLE)), '已載入範例');
    if (id === 'jCsv') exportCsv();
  });
  pb.addEventListener('change', e => {
    const el = e.target, r = selRow(), t = r && r.t, v = el.value;
    try {
      switch (el.id) {
        case 'fName': if (v.trim()) mutate(() => t.name = v.trim()); return;
        case 'fDur': { const d = parseDur(v); if (d == null) throw new Error('工期格式例如 10、10d、2w'); mutate(() => t.dur = d); return; }
        case 'fDl': mutate(() => { if (v) t.deadline = v; else delete t.deadline; }); return;
        case 'fCt': mutate(() => { if (v === 'ASAP') delete t.cons; else t.cons = { type: v, date: (t.cons && t.cons.date) || isoOf(r.start) }; }); return;
        case 'fCd': if (v) mutate(() => t.cons = { type: (t.cons && t.cons.type) || 'SNET', date: v }); return;
        case 'fNotes': mutate(() => { if (v.trim()) t.notes = v; else delete t.notes; }); return;
        case 'oTitle': mutate(() => P.print.title = v); return;
        case 'oPaper': mutate(() => P.print.paper = v); return;
        case 'oOrient': mutate(() => P.print.orient = v); return;
        case 'oRow': mutate(() => P.print.rowH = v.trim() === '' ? 'auto' : v.trim()); return;
        case 'oFont': mutate(() => P.print.font = Math.min(12, Math.max(5, +v || 7.6))); return;
        case 'oTable': mutate(() => P.print.tableFrac = +v); return;
        case 'oDate': mutate(() => P.print.printDate = v); return;
        case 'jTitle': mutate(() => P.title = v); return;
        case 'jStart': if (v) mutate(() => P.start = v); return;
        case 'jFmt': mutate(() => P.dateFmt = v); return;
        case 'jStatus': mutate(() => P.status = v); return;
        case 'jHol': mutate(() => P.holidays = v.split('\n').map(l => l.trim()).filter(Boolean).map(l => { const d = parseDate(l.split(/\s+/)[0]); return d == null ? null : { date: isoOf(d), name: l.split(/\s+/).slice(1).join(' ') }; }).filter(Boolean)); return;
        case 'jNotes': mutate(() => P.notes = v.split('\n').map(s => s.trim()).filter(Boolean).slice(0, 3)); return;
      }
      if (el.dataset.pc) return mutate(() => P.print.cols[el.dataset.pc] = el.checked);
      if (el.dataset.po) return mutate(() => P.print[el.dataset.po] = el.checked);
      if (el.dataset.wd != null) { const d = +el.dataset.wd; return mutate(() => P.workdays = el.checked ? [...new Set([...P.workdays, d])].sort() : P.workdays.filter(x => x !== d)); }
      if (el.dataset.pk != null) {
        const k = +el.dataset.pk, f = el.dataset.pf, p = t.preds[k];
        if (f === 'id') { const pr = S.R[+v - 1]; if (!pr) throw new Error(`沒有 ID ${v} 這項工作`); if (pr.t.uid === t.uid) throw new Error('工作不能連結到自己'); return mutate(() => p.uid = pr.t.uid); }
        if (f === 'type') return mutate(() => p.type = v);
        if (f === 'lag') return mutate(() => p.lag = Math.round(+v || 0));
      }
    } catch (err) { toast(err.message); renderPanel(); }
  });
  pb.addEventListener('input', e => { if (e.target.id === 'oTable') { const l = e.target.previousElementSibling; if (l) l.textContent = `表格佔頁寬 ${Math.round(e.target.value * 100)}%`; } });
  // keyboard
  document.addEventListener('keydown', e => {
    if (!$('#modal').hidden) { if (e.key === 'Escape') $('#modal').hidden = true; return; }
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    const inField = /INPUT|TEXTAREA|SELECT/.test(tag);
    const mod = e.ctrlKey || e.metaKey;
    if (mod && e.key.toLowerCase() === 'z' && !inField) { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if (mod && e.key.toLowerCase() === 'y' && !inField) { e.preventDefault(); redo(); return; }
    if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); saveFile(`${safeName(P.name)}.json`, JSON.stringify(P, null, 1), 'application/json'); return; }
    if (inField) return;
    if (e.key === 'F2' && mod) { e.preventDefault(); e.shiftKey ? unlinkSel() : linkSel(); return; }
    if (e.altKey && e.shiftKey) { const m = { ArrowRight: () => indent(1), ArrowLeft: () => indent(-1), ArrowUp: () => moveRows(-1), ArrowDown: () => moveRows(1) }[e.key]; if (m) { e.preventDefault(); m(); return; } }
    if (e.key === 'Insert') { e.preventDefault(); addTask(false); return; }
    if (UI.act == null) return;
    if (e.key === 'Delete') { e.preventDefault(); delTasks(); return; }
    const mv = { ArrowDown: [1, 0], ArrowUp: [-1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key];
    if (mv) { e.preventDefault(); moveAct(...mv); return; }
    if (e.key === 'Enter' || e.key === 'F2') { e.preventDefault(); startEdit(UI.act, UI.col); return; }
    if (e.key.length === 1 && !mod && !e.altKey) { e.preventDefault(); startEdit(UI.act, UI.col, e.key); }
  });
  // drag & drop files
  let dropEl = null;
  window.addEventListener('dragover', e => { if ([...(e.dataTransfer?.types || [])].includes('Files')) { e.preventDefault(); if (!dropEl) { dropEl = document.createElement('div'); dropEl.className = 'drop'; dropEl.textContent = '放開即開啟 XML / JSON'; document.body.appendChild(dropEl); } } });
  window.addEventListener('dragleave', e => { if (e.relatedTarget == null && dropEl) { dropEl.remove(); dropEl = null; } });
  window.addEventListener('drop', e => { if (dropEl) { dropEl.remove(); dropEl = null; } if (e.dataTransfer?.files?.length) { e.preventDefault(); openFile(e.dataTransfer.files[0]); } });
  window.addEventListener('resize', () => { if (UI.zoom === 'fit') renderGantt(); });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => renderGantt());
  new MutationObserver(() => renderGantt()).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
}

// ============================================================ boot
(function init() {
  let saved = null; try { saved = localStorage.getItem('programme-studio.v1'); } catch (e) { }
  try { P = defaults(saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(SAMPLE || { name: 'New Project', tasks: [] }))); } catch (e) { P = defaults(JSON.parse(JSON.stringify(SAMPLE))); }
  try { const w = localStorage.getItem('programme-studio.split'); if (w) $('#gridPane').style.width = w; } catch (e) { }
  if (window.innerWidth < 900) UI.panel = false;
  $('#panel').hidden = !UI.panel; $('#bPanel').classList.toggle('on', UI.panel);
  bind(); recalc();
  requestAnimationFrame(() => renderGantt());
})();
</script>
</body></html>
